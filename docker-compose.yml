version: '3.8'

services:
  patent-rag:
    build: .
    container_name: patent-rag-app
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - OLLAMA_HOST=0.0.0.0
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./US11960514.pdf:/app/US11960514.pdf
      - ./US6285999.pdf:/app/US6285999.pdf
      - ./questions.txt:/app/questions.txt
      - ollama_models:/root/.ollama
    ports:
      - "8000:8000"
      - "11434:11434"  # Ollama API port
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  ollama_models:
    driver: local
